// grp (data.json group id the read check holds it to), glow (0..1, an ember halo), wrap (px), lh, hl [substring, color],

  const TW = 150, tg = lerp(0, 40, st[1]), bg = lerp(190, 50, st[2]), tot = 3 * (4 * TW + 3 * tg) + 2 * bg, slide = 1400 * (1 - st[0]);
  for (let blk = 0; blk < 3; blk++) for (let tile = 0; tile < 4; tile++) {
    const x = 540 - tot / 2 + blk * (4 * TW + 3 * tg + bg) + tile * (TW + tg) + slide;
    slab(FR.steps, x, 220, TW - 4, 640, 0.25, {dz: 9, fill: "steel", fillA: 0.1 + 0.1 * st[1], glass: true, edge: "steel", edgeA: 0.8 * fade, edgeW: 3, alpha: fade, fog: 1});
    if (st[3] > 0) pline(FR.steps, [[x - 14, 206], [x + TW + 10, 206], [x + TW + 10, 874], [x - 14, 874], [x - 14, 206]],
      {dz: 9, color: "ember", w: 4, dash: [18, 14], alpha: 0.85 * st[3] * fade, glow: 0.4});
  }
  const e = ex(out, 0.24), ys = [318, 468, 618, 768];
  text({key: "p_tag", F, x: 72, y: 172, face: "mono", size: CAP, weight: 500, color: "ash", track: 0.1, enter: {t: gs[0].land, d: 0.3, kind: "wipe"}, exit: e, grp: "steps.s1"});
  const lineTo = ys.reduce((a, y, i) => t >= gs[i].land ? lerp(a, y - 16, expoOut(win(t, gs[i].land, gs[i].land + 0.4))) : a, 250);
  pline(F, [[96, 250], [96, lineTo]], {color: "ember", w: 3, alpha: 0.85 * (1 - win(t, out, out + 0.3)), glow: 0.5});
  ["p_1", "p_2", "p_3", "p_4"].forEach((k, i) => {
    const g = gs[i]; if (t < g.land) return;
    dot(F, 96, ys[i] - 16, 12, "ember", 1 - win(t, out, out + 0.3), {glow: 0.7});
    text({key: k, F, x: 140, y: ys[i], size: fitSize(k, "sans", 600, 54, 0, 860), weight: 600, enter: {t: g.land, d: 0.34, kind: "rise"}, exit: e, grp: "steps." + ["s1", "s2", "s3", "s4"][i]});
  });
  text({key: "p_4s", F, x: 140, y: 832, size: CAP, weight: 400, color: "ash", enter: {t: gs[3].land + 0.14, d: 0.3, kind: "wipe"}, exit: e, grp: "steps.s4"});
},
end(t) {
  const F = FA("end", t), g = G("end", "lockup");
  if (t < seg("end").t0 - P) return;
  // every station's light, far down the path behind the lockup
  const on = clamp((t - seg("end").t0 + P) / (3 * P));
  ORDER.slice(0, -1).forEach((id, i) => { const Lp = keyLightOf(id), d = 152 - Lp[2], u = clamp(on * 1.6 - i * 0.05);
    if (u > 0) glow([Lp[0], 0.35, Lp[2]], 0.2 + 0.014 * d, ["apple", "m4dec", "m4pp", "ultras", "steps"].includes(id) ? "pale" : "ember", 0.75 * u, 0.9); });
  const grp = "end.lockup", land = g.land;
  text({key: "name", F, x: 540, y: 440, size: 200, weight: 620, track: -0.035, align: "center", glow: 0.3, enter: {t: land, d: 0.4, stg: 0.03, kind: "rise"}, grp, id: "end:name"});
  text({key: "version", F, x: 540, y: 560, face: "mono", size: 92, weight: 300, color: "ember", align: "center", glow: 0.4, molten: true, enter: {t: land + 0.1, d: 0.26, stg: 0.05, kind: "rise"}, grp, id: "end:version"});
  text({key: "url", F, x: 540, y: 680, face: "mono", size: CAP, weight: 400, align: "center", enter: {t: land + 0.16, d: 0.26, kind: "wipe"}, grp});

};
function m4Frame(t) {                            // the lanes' plane: the decode station's, blended into the prompt station's
  const a = outOf("m4dec"), b = firstLand("m4pp");
  if (t <= a) return FA("m4dec", t); if (t >= b) return FA("m4pp", t);
  return planeOf(lerpPose(stationPose("m4dec", t), stationPose("m4pp", t), FLY(win(t, a, b))));
}
function keyLightOf(id) { const s = seg(id); return keyLight(s.out - 0.01); }
function hud(t) {                                // the chapter mark, screen space
  const marks = [["h_nv", G("bytes", "fit").land, outOf("m31"), "bytes.fit"], ["h_k", firstLand("thanks"), outOf("thanks"), "thanks.name"],

  for (const [key, a, b, grp] of marks) { if (t < a || t > b + 0.3) continue;
    const al = expoOut(win(t, a, a + 0.3)) * (1 - win(t, b, b + 0.3));
    emit({kind: "mark", z: 0.5, layer: "HUD", draw: RASTER && (ctx => { ctx.fillStyle = rgba("ember", al); ctx.fillRect(72, 84, 24, 24); })});
    text({key, screen: true, x: 112, y: 108, face: "mono", size: CAP, weight: 500, color: "ash", track: 0.14, alpha: al, grp, id: "hud:" + key,

}
function flightness(t) {                         // 0 at a station, rising to 1 mid-flight
  for (let i = 1; i < ORDER.length; i++) { const a = seg(ORDER[i - 1]).out, b = firstLand(ORDER[i]);
    if (t > a - 0.25 && t < b + 0.25) return Math.sin(Math.PI * clamp((t - a + 0.25) / (b - a + 0.5))); }
  return 0;
}
// The flights that carry nothing of their own (title -> bytes, thanks -> apple, steps -> end): embers, in the light of the
// station the flight leaves, hang along the camera's path and drift up, so the move reads as speed through the room.
const SPARK_FLIGHTS = [["title", "bytes"], ["thanks", "apple"], ["steps", "end"]];

  for (const [p, n] of SPARK_FLIGHTS) {

    const env = Math.sin(Math.PI * clamp((t - a) / (b - a + 0.6))), A = POSE[p][1].pos, Bp = POSE[n][0].pos, col = tintAt(a), r = rng(17 + ORDER.indexOf(n));
    for (let i = 0; i < 110; i++) {            // from a fifth of the way along to half a flight past its end, so most lie ahead
      const c = V.lerp(A, Bp, 0.2 + 1.3 * r()), side = (r() < 0.5 ? -1 : 1) * (0.4 + r() * 1.8), h = 0.2 + r() * 2.4, ph = r() * 5, sp = 0.15 + r() * 0.3;
      glow([c[0] + side, h + (t * sp + ph) % 1.0, c[2] + (r() - 0.5) * 2], 0.025 + 0.035 * r(), col, 0.85 * env);

function drawAt(t, tf) {
  NOW = t; TF = tf; DL = [];

  world(t, Lk, tintAt(t));
  if (fl > 0.01) glow(Lk, 0.16, tintAt(t), fl, 1.6 * fl);

// ---- the GPU compositor ---------------------------------------------------------------------------------------------------
let gl, PR = {}, FB = {}, LT = {}, LC = {}, LX = {}, QUAD;
function glInit() {
  const cv = document.getElementById("gl");
  gl = cv.getContext("webgl2", {preserveDrawingBuffer: true, antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false});
  if (!gl) die("no WebGL2 context");
  if (!gl.getExtension("EXT_color_buffer_float")) die("no EXT_color_buffer_float: the accumulation needs float targets");
  gl.getExtension("OES_texture_float_linear");
  const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0., 1.); }`;
  const FS = {
    copy: `#version 300 es
precision highp float; in vec2 uv; out vec4 o; uniform sampler2D t; uniform float g; void main(){ o = texture(t, uv) * g; }`,
    blur: `#version 300 es
precision highp float; in vec2 uv; out vec4 o; uniform sampler2D t; uniform vec2 d; uniform float s;
void main(){ vec4 a = vec4(0.); float w = 0.; float r = ceil(s * 2.6);
  for (int k = -32; k <= 32; k++) { float i = float(k); if (abs(i) > r) continue; float q = exp(-0.5 * i * i / (s * s)); a += texture(t, uv + d * i) * q; w += q; }
  o = a / w; }`,
    post: `#version 300 es
precision highp float; in vec2 uv; out vec4 o; uniform sampler2D t; uniform float seed; uniform float fade;
float h(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
void main(){ vec2 c = uv - 0.5; float r = length(c) * 1.4142; vec2 ca = c * 0.0011;
  vec3 col = vec3(texture(t, uv + ca).r, texture(t, uv).g, texture(t, uv - ca).b);
  col *= mix(1.0, 0.78, smoothstep(0.35, 1.0, r));
  vec2 px = floor(uv * 1080.);
  float n = h(px + seed * 61.7) + h(px * 1.37 + seed * 13.1) - 1.0;
  col = (col + n * 0.022) * fade;

  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) die("shader: " + gl.getShaderInfoLog(s)); return s; };
  for (const [k, src] of Object.entries(FS)) { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, src));

  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const tex = (w, h, f16) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, f16 ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, f16 ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
    return t; };

  for (const L of LAYERS) { LT[L] = tex(W, H, false); const c = document.createElement("canvas"); c.width = W; c.height = H; LC[L] = c; LX[L] = c.getContext("2d"); }

function pass(prog, src, dst, mode, uni) {

function blur(src, sigma) {                      // a gaussian at full, half or quarter size; returns the blurred texture
  if (sigma <= 2.4) { pass("blur", src, FB.a, "copy", {d: [1 / W, 0], s: sigma}); pass("blur", FB.a.t, FB.b, "copy", {d: [0, 1 / H], s: sigma}); return FB.b.t; }
  if (sigma <= 7) { pass("copy", src, FB.ha, "copy", {g: 1}); const s = sigma / 2;
    pass("blur", FB.ha.t, FB.hb, "copy", {d: [2 / W, 0], s}); pass("blur", FB.hb.t, FB.ha, "copy", {d: [0, 2 / H], s}); return FB.ha.t; }
  pass("copy", src, FB.ha, "copy", {g: 1}); pass("copy", FB.ha.t, FB.qa, "copy", {g: 1}); const s = sigma / 4;
  pass("blur", FB.qa.t, FB.qb, "copy", {d: [4 / W, 0], s}); pass("blur", FB.qb.t, FB.qa, "copy", {d: [0, 4 / H], s}); return FB.qa.t;

function rasterize(items) {

  items.slice().sort((a, b) => b.z - a.z).forEach(it => { if (!it.draw) return; used.add(it.layer); it.draw(LX[it.layer], LX.G); });

function post(i, t) {

  pass("post", FB.acc.t, null, "copy", {seed: Math.floor(i / 2) % 4096, fade});

// ---- motion blur: the sub-frame count from how far anything moves over the shutter ---------------------------------------
const SHUTTER = 0.5 / FPS;
function positions(t, tf) { RASTER = false; const out = new Map(); const cam = cameraAt(t);
  for (const it of drawAt(t, tf)) if (it.id && it.bb) out.set(it.id, [(it.bb[0] + it.bb[2]) / 2, (it.bb[1] + it.bb[3]) / 2, it.bb[2] - it.bb[0], it.bb[3] - it.bb[1]]);
  RASTER = true; return [out, cam]; }
function samplesAt(tc) {
  const [a, ca] = positions(Math.max(0, tc - SHUTTER / 2), tc), [b, cb] = positions(Math.min(D.timeline.T, tc + SHUTTER / 2), tc);
  let m = 0;
  for (const [k, p] of a) { const q = b.get(k); if (!q) continue; m = Math.max(m, Math.hypot(p[0] - q[0], p[1] - q[1]) + Math.abs(p[2] - q[2]) / 2 + Math.abs(p[3] - q[3]) / 2); }
  // the camera on its own: three probe points ahead of the frame's camera
  setCam(ca); const pts = [[0, 0, 4], [1.5, -1, 8], [-2, 1, 20]].map(([x, y, z]) => V.add(CAM.pos, V.add(V.mul(CAM.right, x), V.add(V.mul(CAM.up, y), V.mul(CAM.fwd, z)))));
  const pa = pts.map(proj); setCam(cb); const pb = pts.map(proj);
  pa.forEach((p, i) => { if (p && pb[i]) m = Math.max(m, Math.hypot(p[0] - pb[i][0], p[1] - pb[i][1])); });
  return Math.max(1, Math.min(16, Math.ceil(m / 2.2)));
}
function renderFrameAt(tc, i, K) {
  K = K || samplesAt(tc);
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.acc.f); gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  for (let j = 0; j < K; j++) { const t = clamp(tc + ((j + 0.5) / K - 0.5) * SHUTTER, 0, D.timeline.T - 1e-4);
    composeSub(rasterize(drawAt(t, tc)), 1 / K); }

// ---- the checks ------------------------------------------------------------------------------------------------------------
// Settled read text: at least 44 px, inside the margins, not over another settled read box; while its group is read it
// moves under 20 px/s and changes scale under 3 %/s.
function checkAll(f0, f1) {
  const errs = new Map(), note = (k, m) => { if (!errs.has(k)) errs.set(k, m); };
  let prev = new Map(); RASTER = false;
  for (let f = f0; f < f1; f++) {
    const t = Math.min(D.timeline.T - 1e-4, f / FPS), items = drawAt(t, t), now = new Map(), read = [];
    for (const it of items) {
      if (it.kind !== "text" || it.role === "deco") continue;
      const g = it.grp ? GRP[it.grp] : null;
      if (it.role === "read" && !g) note("nogrp:" + it.id, `${it.id} has no group`);
      const settled = it.role === "live" || (g && t >= g.still - 1e-6);
      if (!settled || it.exiting || it.alpha < 0.6) continue;
      const [x0, y0, x1, y1] = it.bb, tol = it.px >= 150 ? 12 : 4;
      if (it.px < 44 - 0.25) note("floor:" + it.id, `${it.id} at ${t.toFixed(3)} s is ${it.px.toFixed(1)} px, under 44`);
      if (x0 < MARGIN - tol || x1 > W - MARGIN + tol || y0 < MARGIN - tol || y1 > H - MARGIN + tol)
        note("edge:" + it.id, `${it.id} at ${t.toFixed(3)} s is past the margin: [${it.bb.map(v => v.toFixed(0)).join(", ")}]`);
      read.push(it);
      if (g && it.role === "read" && t <= g.read_to) {
        now.set(it.id, it.bb); const q = prev.get(it.id);
        if (q) { const v = Math.hypot((x0 + x1 - q[0] - q[2]) / 2, (y0 + y1 - q[1] - q[3]) / 2) * FPS, sc = Math.abs((x1 - x0) / (q[2] - q[0] || 1) - 1) * FPS;
          if (v > 20) note("hold:" + it.id, `${it.id} moves ${v.toFixed(1)} px/s at ${t.toFixed(3)} s while read`);
          if (sc > 0.03) note("scale:" + it.id, `${it.id} scales ${(sc * 100).toFixed(1)} %/s at ${t.toFixed(3)} s while read`); }
      }
    }
    for (let i = 0; i < read.length; i++) for (let j = i + 1; j < read.length; j++) { const a = read[i].bb, b = read[j].bb;
      if (read[i].id === read[j].id) continue;
      if (a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3]) note("over:" + read[i].id + "|" + read[j].id, `${read[i].id} and ${read[j].id} overlap at ${t.toFixed(3)} s`); }
    prev = now;
  }
  RASTER = true;
  return {errors: [...errs.values()], log: [...window.LOG]};
}

// ---- boot ------------------------------------------------------------------------------------------------------------------
(async () => {
  try {
    const url = new URLSearchParams(location.search).get("data") || "data.json";
    D = await (await fetch(url, {cache: "no-store"})).json();
    if (D.film !== window.FILM) die(`data.json is for ${D.film}`);
    P = D.timeline.period; LEAD = D.timeline.lead;
    for (const S of D.timeline.segments) { SEG[S.id] = S; for (const g of S.groups) GRP[S.id + "." + g.name] = g; }
    for (const id of ORDER) seg(id);
    for (const [fam, file] of [["Geist", "fonts/Geist-Variable.ttf"], ["GeistMono", "fonts/GeistMono-Variable.ttf"]]) {
      const ff = new FontFace(fam, `url(${file})`, {weight: "100 900"}); await ff.load(); document.fonts.add(ff); }
    await document.fonts.ready;
    if (!document.fonts.check("300 40px GeistMono") || !document.fonts.check("600 40px Geist")) die("the fonts did not load");
    stations(); glInit();
    window.T = D.timeline.T;
    window.seek = t => { renderFrameAt(clamp(t, 0, D.timeline.T - 1e-4), Math.round(t * FPS)); };
    window.frame = (i, K) => { const k = renderFrameAt(Math.min(i / FPS, D.timeline.T - 1e-4), i, K); return [k, document.getElementById("gl").toDataURL("image/jpeg", 0.95)]; };
    window.samples = i => samplesAt(Math.min(i / FPS, D.timeline.T - 1e-4));
    window.checkAll = checkAll;
    window.ready = true;
  } catch (e) { window.fault = window.fault || String(e); console.error("FAULT: " + window.fault); window.ready = true; }
})();
</script>
