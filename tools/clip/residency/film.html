<!doctype html>
<html><head><meta charset="utf-8"><title>adaptive residency</title>
<style>
  @font-face { font-family: Brush; src: url(fonts/CaveatBrush-Regular.ttf); }
  @font-face { font-family: Hand; src: url(fonts/GochiHand-Regular.ttf); }

  #stage { width: 1080px; height: 1080px; display: block; }
</style></head>
<body>
<canvas id="stage" width="1080" height="1080"></canvas>
<script>
// Every frame is a pure function of t (seconds): no timers, no state carried between frames.
// Numbers come from data.json (make_data.py). Dot positions are schematic; hit % and tok/s are the sitting's records.
const W = 1080, H = 1080, T = 42;
const PAPER = '#EFE8DA', CARD = '#FBF7EE', INK = '#17140F', GRAY = '#8C867B', HOT = '#E0503A',
      AMBER = '#F2B83B', LIGHT = '#F6DC8E', BLUE = '#2E5E9E', LBLUE = '#7FA6DE', DIMP = '#CFC6B4';
const ARM = {
  off: { col: GRAY, name: 'fixed seats' },
  rule: { col: BLUE, name: 'watches itself' },
  stream: { col: HOT, name: 'prompt picks' },

let D = null, BF = 0;
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');

// ---- small math ------------------------------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const io = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

// ---- brush ---------------------------------------------------------------------------------------------------

// A tapered, wobbling ribbon with dry-brush gaps. o.p reveals it from the start (0..1).

const line = (x0, y0, x1, y1, w, col, seed, o) => brush([[x0, y0], [x1, y1]], w, col, seed, o);
// An ink blot: a lumpy closed shape, optional splash spikes and satellite dots.
function blot(x, y, r, col, seed, o = {}) {

    const a = hsh(seed, j, 8) * 6.283, d = r * (1.6 + hsh(seed, j, 9) * 1.3) * (o.spk || 1);
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, 1 + hsh(seed, j, 10) * 1.7, 0, 6.283); ctx.fill();

}
// A filled region with a hand-cut edge.
function roughPoly(corners, col, seed, amp = 2.5) {
  const pts = [];
  for (let c = 0; c < corners.length; c++) {
    const [ax, ay] = corners[c], [bx, by] = corners[(c + 1) % corners.length];
    const n = Math.max(2, Math.round(Math.hypot(bx - ax, by - ay) / 26));
    for (let i = 0; i < n; i++) pts.push([lerp(ax, bx, i / n), lerp(ay, by, i / n)]);

    const x = p[0] + (hsh(seed, i, BF) - .5) * 2 * amp, y = p[1] + (hsh(seed, i, BF + 7777) - .5) * 2 * amp;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);

}
// Dry-brush streaks inside an ink mass: thin broken paper-colored lines, clipped to the current path.

    const y = lerp(y0, y1, hsh(seed, k, 1)), ang = (hsh(seed, k, 2) - .5) * .06, a0 = ctx.globalAlpha;
    ctx.globalAlpha = a0 * (.18 + .3 * hsh(seed, k, 3)) * (o.a ?? 1);

      const yy = y + (x - x0) * ang + (n1(x * .02, bs + 9) - .5) * 3;

// Handwriting: per-letter jitter that boils, revealed letter by letter.
function hand(s, x, y, size, col, o = {}) {

  const ch = [...s], ws = ch.map(c => ctx.measureText(c).width), tw = ws.reduce((a, b) => a + b, 0);

    if (i < show && ch[i] !== ' ') {

// ---- paper -----------------------------------------------------------------------------------------------------
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(() => {
  const g = bg.getContext('2d'), r = mulberry32(5);
  g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 110000; i++) {
    g.fillStyle = r() < .55 ? `rgba(70,52,30,${.03 + r() * .04})` : `rgba(255,255,250,${.05 + r() * .06})`;
    g.fillRect(r() * W, r() * H, 1 + r(), 1 + r());
  }
  g.lineCap = 'round';
  for (let i = 0; i < 700; i++) {
    const x = r() * W, y = r() * H, a = r() * 6.283, l = 4 + r() * 14;
    g.strokeStyle = `rgba(90,70,45,${.04 + r() * .04})`; g.lineWidth = .6;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + .5) * l * .5, y + Math.sin(a + .5) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();

  v.addColorStop(0, 'rgba(80,60,35,0)'); v.addColorStop(1, 'rgba(80,60,35,.16)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);

// ---- layout ----------------------------------------------------------------------------------------------------
const LAMP = [540, 116], CONE_TOP = 142, CONE_BOT = 478, HW_TOP = 36, HW_BOT = 330;
const hw = y => HW_TOP + (y - CONE_TOP) / (CONE_BOT - CONE_TOP) * (HW_BOT - HW_TOP);
const COLS = 14;
let NSEAT = 70, PIN = 40, NL = 40, K = 6;
function seatXY(s) {
  const r = Math.floor(s / COLS), c = s % COLS, y = 298 + r * 40, u = 2 * (hw(y) - 30);
  return [540 - u / 2 + c * u / (COLS - 1), y, 8.5 + r * 1.15];
}
const HX0 = 100, HX1 = 980, HY0 = 560, HY1 = 744, HCOLS = 27, HROWS = 12;
const hostXY = q => [HX0 + (q % HCOLS) * (HX1 - HX0) / (HCOLS - 1) + (hsh(q, 31) - .5) * 12, HY0 + Math.floor(q / HCOLS) * (HY1 - HY0) / (HROWS - 1) + (hsh(q, 32) - .5) * 5, 6.3 * (.7 + .6 * hsh(q, 33))];

// ---- the three decode runs as a timeline ------------------------------------------------------------------------
const POP = new Float64Array(384);
(() => { const r = mulberry32(11), perm = [...Array(384).keys()]; for (let i = 383; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; } perm.forEach((id, rank) => POP[id] = 1 / Math.pow(rank + 6, 1.15)); })();
const HOSTSLOT0 = new Int16Array(384).fill(-1);
function seedState() {

  for (let s = 0; s < NSEAT - 1; s++) { seat[s] = s; where[s] = s; }     // the last seat is the spare
  for (let id = 0; id < 384; id++) if (where[id] < 0) host[id] = HOSTSLOT0[id];

}
const cloneState = S => ({ seat: S.seat.slice(), where: S.where.slice(), host: S.host.slice() });
function applySwap(S, hot, cold) {
  const s = S.where[cold], q = S.host[hot];

  S.where[cold] = -1; S.host[cold] = q;
}
function knotsT(kn) {
  const f = i => { for (let j = 1; j < kn.length; j++) if (i <= kn[j][0] || j === kn.length - 1) return lerp(kn[j - 1][1], kn[j][1], (i - kn[j - 1][0]) / (kn[j][0] - kn[j - 1][0])); };

const ACTS = {};
function buildAct(name, arm, kn, flights, prompt) {
  const st = knotsT(kn), h = hits(arm), S = seedState(), ev = [], steps = [];

    const hotL = [...Array(384).keys()].filter(id => S.where[id] < 0 && !inFlight.has(id)).sort((a, b) => key(b) - key(a));
    const coldL = [...Array(384).keys()].filter(id => S.where[id] >= PIN && !inFlight.has(id)).sort((a, b) => key(a) - key(b));

// ---- timeline --------------------------------------------------------------------------------------------------
let LAST = 95;
const A1 = 4.6, A2 = 11.6, A3 = 21.6, A4 = 30.4, A5 = 37.0, FOCUS_L = 7, SHOW = 15;
function build() {
  const m = D.meta;

  NSEAT = typeof m.card_slots_per_layer === 'number' ? m.card_slots_per_layer : Math.round(mean(m.card_slots_per_layer));

  const r = mulberry32(3), slots = [...Array(HCOLS * HROWS).keys()];
  for (let i = slots.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }

    const FL = D.arms[arm].flights;

    const from = j => FL ? FL[j].made : Math.max(0, b[j] - 3);

  const perLayer = Math.max(1, Math.round(D.call_stream_end.p512.admitted / NL));
  buildAct('stream', 'stream', [[0, A3 + 4.4], [LAST, A4 - 1.8]], ruleFlights('stream'), { t0: A3 + 2.6, n: perLayer });

// ---- drawing: the layer ---------------------------------------------------------------------------------------
function stageAndHost(t, a, reveal) {
  if (a <= 0) return;

    ctx.save(); ctx.beginPath(); ctx.moveTo(0, 0);
    for (let y = 480; y <= 790; y += 12) ctx.lineTo(40 + hr * 1000 + (n1(y * .05, 49) - .5) * 70 * (1 - hr * .7), y);

    const q = u * NL, l = Math.min(NL - 1, Math.floor(q)), f = q - l, c = Math.floor(l / 10), r = l % 10;
    const x = SX(c) + 20 + f * 0, y = SY(r) + 19 + f * 58;
    blot(x, y, 9, HOT, 1860 + j, { spikes: 3, spk: .4 });
    const w = (toks[j] || '').includes('\n') ? '⏎' : (toks[j] || '').trim();
    if (w) hand(w, x + 14, y + 8, 24, INK, { font: 'Brush', seed: 1870 + j, outline: PAPER, ow: 5 });
  }
  ctx.restore();
}
function introAnswer(t, a) {
  if (a <= 0) return;
  const toks = D.arms.off.tokens || [], n = [...Array(9).keys()].filter(j => t >= .7 + j * .26 + 1.3).length;
  ctx.save(); ctx.globalAlpha = a;
  const x = 72, y = 880, w = 936, h = 64;
  roughPoly([[x, y], [x + w, y - 3], [x + w + 2, y + h], [x - 2, y + h + 2]], CARD, 1880, 1.5);
  brush([[x, y], [x + w, y - 3], [x + w + 2, y + h], [x - 2, y + h + 2], [x, y]], 4, INK, 1881, { dry: 0, flat: true });
  hand('output:', x + 18, y + 44, 32, GRAY, { font: 'Brush', seed: 1882 });
  ctx.font = '34px Hand'; const ln = wrapText(toks.slice(0, n).join('').replace(/\n+/g, ' ⏎ '), w - 160);
  hand(ln[ln.length - 1] || '', x + 130, y + 44, 34, INK, { seed: 1883, still: true });
  ctx.restore();
}

function wrapText(text, maxw) {               // words first; a run without spaces (a URL) breaks by characters
  const lines = []; let cur = '';
  for (const ch of text) {
    const tr = cur + ch;
    if (ctx.measureText(tr).width > maxw) {
      const cut = cur.lastIndexOf(' ');
      if (cut > cur.length * .5) { lines.push(cur.slice(0, cut)); cur = cur.slice(cut + 1) + ch; } else { lines.push(cur); cur = ch; }
    } else cur = tr;
  }
  if (cur) lines.push(cur);
  return lines;
}
// ---- the race ----------------------------------------------------------------------------------------------------
function race(t, t0, t1) {
  const a = fadeIO(t, t0, t1, .4, .3); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const RATE = .25, MAXN = 60, ms = Math.max(0, t - (t0 + .8)) * RATE * 1000;
  hand('same prompt, three ways · the output, 4× slower than real', 540, 162, 34, INK, { font: 'Brush', align: 'center', seed: 1500 });
  ['off', 'rule', 'stream'].forEach((arm, k) => {
    const A = D.arms[arm], y = 240 + k * 214, col = ARM[arm].col;
    let n = 0, c = 0; while (n < A.step_ms.length && c + A.step_ms[n] <= ms) { c += A.step_ms[n]; n++; }
    hand(ARM[arm].name, 66, y, 52, col, { font: 'Brush', seed: 1510 + k });
    hand(`${n} tokens`, 1016, y, 44, INK, { font: 'Brush', align: 'right', seed: 1550 + k });
    roughPoly([[62, y + 18], [1018, y + 14], [1020, y + 124], [60, y + 128]], CARD, 1520 + k, 1.5);
    brush([[62, y + 18], [1018, y + 14], [1020, y + 124], [60, y + 128], [62, y + 18]], 4, INK, 1530 + k, { dry: 0, flat: true });
    const text = (A.tokens || []).slice(0, n).join('').replace(/\n+/g, ' ⏎ ').replace(/\s+/g, ' ');
    ctx.font = '38px Hand'; const lines = wrapText(text, 910);
    lines.slice(-2).forEach((ln, j) => hand(ln, 82, y + 64 + j * 44, 38, INK, { seed: 1540 + j + lines.length, still: true }));
    const bw = 956 * Math.min(1, n / MAXN);
    if (bw > 2) brush([[62, y + 146], [62 + bw, y + 146]], 12, col, 1580 + k, { dry: 0, flat: true, jit: .1 });
    if (t > t1 - 2.4) hand(`${mean(A.tg_tps.p512).toFixed(1)} tok/s`, 1016, y + 180, 44, col, { font: 'Brush', align: 'right', seed: 1560 + k, reveal: (t - (t1 - 2.4)) * 3 });
  });
  const v0 = mean(D.arms.off.tg_tps.p512), v2 = mean(D.arms.stream.tg_tps.p512);
  if (t > t1 - 1.8) hand(`+${Math.round((v2 / v0 - 1) * 100)}% on the same GPU`, 66, 1000, 56, HOT, { font: 'Brush', seed: 1570, reveal: (t - (t1 - 1.8)) * 2 });
  ctx.restore();
}
function rewindFX(t, t0, t1, cx = 540, cy = 470, rot = 0) {
  const a = fadeIO(t, t0, t1, .15, .25); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a * .18; ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalAlpha = a;
  for (let k = 0; k < 12; k++) { const y = ((hsh(k, BF, 1) * H) | 0), x0 = hsh(k, BF, 2) * 400; brush([[x0, y], [x0 + 300 + hsh(k, BF, 3) * 500, y + 2]], 3, PAPER, 1400 + k + BF, { dry: 0 }); }
  ctx.translate(cx, cy); ctx.rotate(rot); ctx.translate(-cx, -cy);
  for (const dx of [-60, 30]) brush([[cx + dx + 70, cy - 60], [cx + dx, cy], [cx + dx + 70, cy + 60], [cx + dx + 70, cy - 60]], 16, INK, 1450 + dx, { dry: .5, flat: true });
  hand('rewind', cx, cy + 130, 60, INK, { font: 'Brush', align: 'center', seed: 1460, outline: PAPER, ow: 10 });
  ctx.restore();
}

// ---- act 0: the hook (unused) ------------------------------------------------------------------------------------
function hook(t) {
  const a = 1 - io((t - (A1 - .3)) / .4);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const r = 95 * out((t - .1) / .35) * (1 - io((t - .75) / .6));
  if (r > 1) { blot(540, 560, r, INK, 7, { spikes: 13, spk: 1.1, dots: 10 }); ctx.beginPath(); ctx.arc(540, 560, r * .95, 0, 6.283); streaks(540 - r, 560 - r, 540 + r, 560 + r, 8, 9); }
  hand(`The GPU seats ${NSEAT} of them.`, 540, 912, 58, INK, { font: 'Brush', align: 'center', reveal: write(t, 1.3, 'The GPU seats 70 of them.', 24), seed: 110 });
  hand(`Which ${NSEAT}?`, 540, 988, 64, HOT, { font: 'Brush', align: 'center', reveal: write(t, 2.35, 'Which 70?', 16), seed: 111 });
  ctx.restore();
}

// ---- act 4: bars -----------------------------------------------------------------------------------------------
let PAPER_PAT = null;
function wipe(t, t0) {   // paper-colored brush strokes sweep the page
  const u = clamp((t - t0) / .7); if (u <= 0) return;
  PAPER_PAT = PAPER_PAT || ctx.createPattern(bg, 'no-repeat');
  for (let k = 0; k < 10; k++) {
    const y = 40 + k * 112, s = clamp(u * 1.6 - k * .06);
    if (s > 0) brush([[-40, y], [W + 40, y + 10]], 160, PAPER_PAT, 300 + k, { p: s, dry: 0, flat: true, jit: .1 });
  }
}
function bars(t, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const arms = ['off', 'rule', 'stream'], base = 860, scale = 470 / Math.max(...arms.flatMap(a => [mean(D.arms[a].tg_tps.p512), mean(D.arms[a].tg_tps.p4096)])), groups = [['p512', 'after a 512-token prompt', 150], ['p4096', 'after a 4,096-token prompt', 590]];
  arms.forEach((arm, k) => {
    const x = [100, 410, 740][k];
    blot(x, 206, 12, ARM[arm].col, 700 + k);
    hand(ARM[arm].name, x + 24, 218, 36, ARM[arm].col, { reveal: write(t, A4 + .6 + k * .2, ARM[arm].name, 30), seed: 701 + k });
  });
  groups.forEach(([key, label, gx], g) => {
    line(gx - 10, base, gx + 350, base + 2, 5, INK, 710 + g, { p: out((t - A4 - .5) / .5) });
    hand(label, gx + 170, base + 46, 34, GRAY, { align: 'center', reveal: write(t, A4 + .9, label, 34), seed: 712 + g });
    arms.forEach((arm, k) => {
      const v = mean(D.arms[arm].tg_tps[key]), x0 = gx + 12 + k * 112, bw = 86;
      const u = out((t - (A4 + .8 + g * .35 + k * .15)) / .7), h = v * scale * u;
      if (u <= 0) return;
      ctx.save(); ctx.beginPath(); ctx.rect(x0 - 4, base - h, bw + 8, h); ctx.clip();
      for (let j = -6; j < 40; j++) line(x0 + j * 13 + (hsh(j, k, g) - .5) * 6, base + 4, x0 + j * 13 + 70 + (hsh(j, k, g + 5) - .5) * 30, base - 540, 6, ARM[arm].col, 720 + g * 50 + k * 60 + j, { dry: 0, jit: .15 });
      ctx.restore();
      brush([[x0, base], [x0, base - h], [x0 + bw, base - h], [x0 + bw, base]], 4, INK, 780 + g * 5 + k, { dry: 0, flat: true, jit: .2 });
      if (u > .9) hand(v.toFixed(1), x0 + bw / 2, base - h - 14, 40, ARM[arm].col, { font: 'Brush', align: 'center', seed: 790 + g * 5 + k });
    });
    const v0 = mean(D.arms.off.tg_tps[key]), v2 = mean(D.arms.stream.tg_tps[key]), gain = Math.round((v2 / v0 - 1) * 100);
    const ga = clamp((t - (A4 + 2.2 + g * .3)) / .4);
    if (ga > 0) {
      ctx.save(); ctx.globalAlpha = a * ga;
      const xa = gx + 12 + 43, xb = gx + 12 + 224 + 43, ya = base - v0 * scale - 60, yb = base - v2 * scale - 60;
      trail([xa, ya], [xb, yb], 0, ga, 70, HOT, 800 + g, 4);
      hand(`+${gain}%`, (xa + xb) / 2, Math.min(ya, yb) - 58, 46, HOT, { font: 'Brush', align: 'center', seed: 805 + g });
      ctx.restore();
    }
  });
  ctx.restore();
}

// ---- act 5: the end --------------------------------------------------------------------------------------------
function finale(t) {
  if (t < A5) return;
  const u = clamp((t - A5) / .55);
  for (let k = 0; k < 26; k++) {
    const ang = k / 26 * 6.283 + hsh(k, 3) * .2, l = 900 * out(u * 1.2 - hsh(k, 4) * .25);
    if (l > 5) brush([[540, 540], [540 + Math.cos(ang) * l, 540 + Math.sin(ang) * l]], 150 + hsh(k, 5) * 120, INK, 900 + k, { dry: .5 });
  }
  blot(540, 540, 170 * out(u * 1.5), INK, 950, { spikes: 12, spk: 1.2 });
  const f = clamp((t - A5 - .45) / .25);
  if (f > 0) { ctx.save(); ctx.globalAlpha = f; ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  const t0 = A5 + .6;
  hand('run it again →', 540, 440, 86, PAPER, { font: 'Brush', align: 'center', reveal: write(t, t0, 'run it again →', 30), seed: 960 });
  hand('same text.', 540, 540, 86, PAPER, { font: 'Brush', align: 'center', reveal: write(t, t0 + .5, 'same text.', 30), seed: 961 });
  line(380, 566, 700, 572, 7, HOT, 962, { p: clamp((t - t0 - 1.0) / .4), gap: INK });
  hand('the GPU\'s seats follow the conversation,', 540, 664, 46, DIMP, { font: 'Brush', align: 'center', reveal: write(t, t0 + 1.0, 'x'.repeat(30), 60), seed: 963 });
  hand('and change only between tokens', 540, 718, 46, DIMP, { font: 'Brush', align: 'center', reveal: write(t, t0 + 1.4, 'x'.repeat(24), 60), seed: 966 });
  hand('bloomery  ·  DeepSeek-V4.1-Flash  ·  one RTX A6000 + host RAM', 540, 822, 34, GRAY, { align: 'center', reveal: write(t, t0 + 1.9, 'x'.repeat(30), 60), seed: 964 });
  hand('github.com/midagedev/bloomery', 540, 874, 40, AMBER, { align: 'center', reveal: write(t, t0 + 2.2, 'x'.repeat(30), 60), seed: 965 });
}

function frame() {
  const sd = 990, M = 22;
  line(M - 6, M, W - M + 8, M + 2, 9, INK, sd); line(W - M, M - 6, W - M + 1, H - M + 8, 9, INK, sd + 1);
  line(W - M + 6, H - M, M - 8, H - M - 1, 9, INK, sd + 2); line(M, H - M + 6, M - 1, M - 8, 9, INK, sd + 3);
}
function stamp() {
  if (!D.placeholder) return;
  ctx.save(); ctx.translate(540, 1046); ctx.globalAlpha = .85;
  ctx.font = '24px Hand'; ctx.fillStyle = '#C0182B'; ctx.textAlign = 'center'; ctx.fillText('PLACEHOLDER NUMBERS', 0, 0);
  ctx.restore();
}

// ---- scene ----------------------------------------------------------------------------------------------------
function scene(t) {
  BF = Math.floor((t * 60 + .5) / 5);                 // 12 boils a second, changing between frames, never inside one
  ctx.globalAlpha = 1; ctx.drawImage(bg, 0, 0);
  const stageA = clamp((t - 4.2) / .35);
  if (t < 4.6) { introShelves(t, 1); introAnswer(t, fadeIO(t, 1.0, 3.9, .3, .2)); wipe(t, 3.72); }
  const act = t < A2 ? ACTS.fixed : t < A3 ? ACTS.rule : ACTS.stream;
  if (t < A4 + .8 && stageA > 0) {
    ctx.save(); ctx.globalAlpha = stageA;
    stageAndHost(t, 1, 1);
    experts(t, t < A1 ? null : act, 1);
    sideLabels(t, fadeIO(t, A2 - 1.4, A2 + 3.2, .4, .4));
    hand('host RAM  ·  the CPU does these  ·  slow', 92, 540, 36, DIMP, { seed: 43, outline: INK, ow: 6 });
    ladder(t, 1);
    nowWord(t, t < A1 ? null : act, 1);
    chart(t, t < A1 ? 0 : 1);
    bigNumber(t, act, t < A1 ? 0 : 1);
    swapFX(t, t < A1 ? null : act);
    swapCount(t, act, t >= A2 && t < A4 ? 1 : 0);
    ctx.restore();
  } else FX = [];
  if (t >= A4) { wipe(t, A4); race(t, A4 + .4, A5 + .2); }
  caption(t, 'every token walks 40 layers.', .3, 3.9, 119);
  caption(t, 'one layer. 384 experts.', 4.1, A1 + .6, 120);
  caption(t, 'fixed seats.', A1 + .6, A2, 121);
  caption(t, 'it watches itself.', A2, A3, 122);
  caption(t, 'the prompt picks.', A3 + .8, A4, 123);
  caption(t, 'the race.', A4 + .4, A5 + .2, 124);
  const pp = D.arms.stream.pp_tps.p4096[0] / D.arms.rule.pp_tps.p4096[0] - 1, per = Math.round(D.call_stream_end.p512.admitted / NL);
  const SUBS = [
    [1.2, 3.9, `each layer: 384 experts, ${NSEAT} fit on the GPU`, INK],
    [A1 + .4, A1 + 3.4, `seats set once, at load: the first ${NSEAT - 1} ids`, INK],
    [A1 + 3.6, A2 - .1, 'most calls land in the dark room', INK],
    [A2 + .3, A2 + 1.9, 'it counts every call', INK],
    [A2 + 2.0, A2 + 5.0, 'the hottest one in RAM is copied up in the background', HOT],
    [A2 + 5.1, A2 + 6.8, 'the coldest seat goes back to RAM', BLUE],
    [A2 + 6.9, A2 + 8.4, 'swaps land only between tokens', INK],
    [A2 + 8.5, A3 - .05, 'same history → same output', INK],
    [A3 + .9, A3 + 2.4, 'then a 512-token prompt arrives', INK],
    [A3 + 2.5, A3 + 4.6, `its ${per} hottest experts a layer move in, and stay`, HOT],
    [A3 + 4.7, A3 + 6.9, `the prompt itself: about the same speed (${pp >= 0 ? '+' : '−'}${Math.abs(pp * 100).toFixed(1)}%)`, GRAY],
    [A3 + 7.0, A4, 'the win is the decode after it', INK],
  ];
  for (const [a0, a1, str, col] of SUBS) subtitle(t, str, a0, a1, col);
  if (t >= A3 + .8 && t < A3 + 4.2) promptStrip(t);
  rewindFX(t, A3, A3 + .8, 720, 420, .05);
  finale(t);
  frame();
  stamp();
}
function promptStrip(t) {
  const u = io((t - (A3 + 1.2)) / 1.3), a = fadeIO(t, A3 + 1.2, A3 + 4.1, .25, .4);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const x = lerp(-280, 330, u), y = 590;
  roughPoly([[x, y], [x + 250, y - 6], [x + 254, y + 136], [x + 4, y + 140]], CARD, 130, 2);
  brush([[x, y], [x + 250, y - 6], [x + 254, y + 136], [x + 4, y + 140], [x, y]], 4, INK, 131, { dry: 0, flat: true });
  for (let k = 0; k < 5; k++) line(x + 22, y + 34 + k * 22, x + 150 + hsh(k, 1) * 80, y + 32 + k * 22, 3, GRAY, 132 + k, { dry: 0 });
  hand('512-token prompt', x + 128, y - 18, 34, CARD, { align: 'center', seed: 138, outline: INK, ow: 6 });
  ctx.restore();
}

window.seek = t => {
  scene(t);
  const LOOP = .5, k = (t - (T - LOOP)) / LOOP;         // cross-fade into frame 0 for a clean loop
  if (k > 0) {
    const snap = document.createElement('canvas'); snap.width = W; snap.height = H; snap.getContext('2d').drawImage(cv, 0, 0);
    scene(0);
    const f0 = document.createElement('canvas'); f0.width = W; f0.height = H; f0.getContext('2d').drawImage(cv, 0, 0);
    ctx.globalAlpha = 1; ctx.drawImage(snap, 0, 0); ctx.globalAlpha = io(k); ctx.drawImage(f0, 0, 0); ctx.globalAlpha = 1;
  }
};
(async () => {
  D = await (await fetch('data.json', { cache: 'no-store' })).json();
  await Promise.all([document.fonts.load('40px Brush'), document.fonts.load('40px Hand')]);
  build();
  ACTS.stream.rewindFrom = { t0: A3 + .05, t1: A3 + .8, S: ACTS.rule.end };
  window.seek(0); window.ready = true;
})();
</script>
