# /etc/modules-load.d/ipmi_watchdog.conf
#
# Load the IPMI watchdog driver at boot so systemd has a /dev/watchdog to pet.
#
# The BMC arms a watchdog at POST with timer use "OS Load" and action Hard
# Reset, expecting the OS to take it over or shut it off once booted. Nothing
# on this machine did, so from 2026-09-12 it hard-reset every ~10 minutes —
# four times before anyone noticed, leaving no shutdown record at all, because
# a hard reset does not get to write one.
#
# Taking the timer over is better than switching it off: this machine is
# headless and reached only over the network, so a kernel that wedges is
# otherwise unrecoverable without walking to it.
ipmi_watchdog
