# /etc/systemd/system.conf.d/watchdog.conf
#
# PID 1 opens /dev/watchdog, sets the hardware timeout to RuntimeWatchdogSec,
# and pets it at half that interval. If systemd itself stops running, nothing
# pets it and the BMC resets the board.
#
# 120s, not the 10s some guides use. This machine deliberately runs near its
# memory limit — llm.service holds ~111 GB resident with OOMPolicy=continue —
# and a stall in PID 1 under memory pressure must not be mistaken for a hang.
# The cost of the longer window is that recovery from a real wedge takes up to
# two minutes instead of ten seconds, which is nothing compared to the twenty
# hours this machine was unreachable on 2026-09-11.
#
# RebootWatchdogSec covers the other direction: a shutdown that hangs on the
# way down still gets reset rather than sitting there forever.
[Manager]
RuntimeWatchdogSec=120
RebootWatchdogSec=10min
