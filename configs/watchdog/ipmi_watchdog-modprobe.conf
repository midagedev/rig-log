# /etc/modprobe.d/ipmi_watchdog.conf
#
# action=reset      what the BMC does when the timer expires
# panic_wdt_timeout on a kernel panic, give the panic path this many seconds to
#                   write something out before the reset lands
#
# No start_now=1: the timer must not run before systemd is petting it, or the
# very window this is meant to protect becomes the window it fires in. systemd
# sets the real timeout itself, from RuntimeWatchdogSec, when PID 1 opens the
# device.
options ipmi_watchdog action=reset panic_wdt_timeout=60
