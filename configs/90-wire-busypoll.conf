# /etc/sysctl.d/90-wire-busypoll.conf, on the workstation and on the DGX Spark (configs/spark/ names the same file).
# A blocking socket read spins up to 50 µs on the NIC's queue before it sleeps. The bloomery tier Wire reads blocking
# with TCP_NODELAY, and on the direct 10GbE cable its round trip is set by the reader waking, not by the wire: a 64 B
# round trip went from p50 512 µs to 27 µs with this on both ends (log 2026-11-04 spark-wire-tuning). The cost is up to
# 50 µs of one core spinning per read that waits, on any socket.
net.core.busy_read = 50
net.core.busy_poll = 50
