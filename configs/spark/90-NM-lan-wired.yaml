# The DGX Spark's wired LAN: its RJ45 10GbE port enP7s7 (Realtek r8127) on the home router, DHCP, the default route
# at metric 100 so it wins over the Wi-Fi profile (metric 600, kept up as a fallback). Since 2026-11-24; before that
# the same port was a direct 10GbE cable to the workstation (log 2026-11-04 spark-direct-link), and the workstation
# link moved to ConnectX (90-NM-spark-ws-cx.yaml). The router port links at 1000 Mb/s. Made by `nmcli con mod` of the
# old spark-ws-link profile:
#   nmcli con mod spark-ws-link connection.id lan-wired ipv4.method auto ipv4.addresses "" ipv4.gateway "" \
#     ipv4.never-default no ipv4.route-metric 100 ipv6.method auto
# NM keeps profiles as netplan files: this is /etc/netplan/90-NM-<uuid>.yaml (mode 600) as it wrote it, the uuid and
# timestamp left out.
network:
  version: 2
  ethernets:
    NM-lan-wired:
      renderer: NetworkManager
      match:
        name: "enP7s7"
      dhcp4: true
      dhcp4-overrides:
        route-metric: 100
      dhcp6: true
      wakeonlan: true
      networkmanager:
        name: "lan-wired"
        passthrough:
          connection.autoconnect-priority: "-999"
          ethernet._: ""
          ipv6.addr-gen-mode: "default"
          ipv6.ip6-privacy: "-1"
          proxy._: ""
